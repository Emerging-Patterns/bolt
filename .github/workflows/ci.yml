# nix flake check: the bolt package, checks.proofs (every PROOF.bend on the
# flake's bend prints ALL PROOFS CHECK) and checks.lint (mkLint: bolt on this tree).

name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    uses: Emerging-Patterns/actions/.github/workflows/nix-flake-check.yml@5b0aa4f0eaee72662e06479ecebcfd15e9762fe7
    with:
      # the shared default still names macos-14, which GitHub retires on
      # 2026-11-02 and fails in brownouts before then (no runner is assigned);
      # macos-15 is arm64 too, so aarch64-darwin is still checked
      runners: '["ubuntu-latest", "ubuntu-24.04-arm", "macos-15"]'
