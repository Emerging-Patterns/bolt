# Sibling of Emerging-Patterns/ez CI; keep shape aligned.
#
# bolt default branch is main (ez: master). Same job: install nix,
# then `nix flake check -L` (bolt package + c-check). No extra jobs.
# Native `./gate.sh` is omitted: those compiles peak ~8 GB+ and OOM
# on typical GHA RAM (~7 GB). Flake check is the native build.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check -L
