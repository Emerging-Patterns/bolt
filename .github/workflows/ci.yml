# One `check` job: `nix develop -c ./gate.sh --js-only`.
#
# `nix flake check` builds the bolt package (~8 GB peak) and OOMs on
# typical GHA RAM (~7 GB). The JS-lane gate is the light check: laws
# and tests, no native compile (~2.5 GB).

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix develop -c ./gate.sh --js-only
