# Cuts a vX.Y.Z tag and GitHub Release from workflow_dispatch
# (a GITHUB_TOKEN tag does not start release.yml).
#
# How to cut a release
#   1. Land the version on the default branch. These files name it and all
#      must agree: flake.nix, bolt/version.bend, editors/vscode/package.json,
#      its package-lock.json, the VSIX named in README.md and in
#      editors/vscode/README.md, and the help and initialize strings in
#      bolt/spec/cases.bend and bolt/spec/LAWS.bend.
#   2. Actions -> Tag -> Run workflow, from that branch:
#        - leave version empty and bump=none -> tag what the files say
#        - version=X.Y.Z -> tag that (fails if the files disagree)
#        - bump=patch|minor|major -> rewrite the version files, commit,
#          tag the new X.Y.Z
#   3. Or tag locally: `git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z`
#      (release.yml then opens the GitHub Release).
#
# Does not publish the VS Code extension. Does not upload to the Bend hub:
# that is `publish.yml`, workflow_dispatch only, on a tag this has already
# cut. Does not build bolt: what a tag carries is the source, and the two ways in are
# `nix profile install` and one `bend` line (README.md), neither of which
# wants a binary attached to a release.

name: tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to tag (empty = version in the repo files)"
        required: false
        type: string
        default: ""
      bump:
        description: "If version is empty, bump files then tag"
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Resolve version
        id: ver
        env:
          VERSION_IN: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # every file that names the version, as `path<TAB>X.Y.Z`. The two
          # READMEs name it as the VSIX `npx vsce package` writes, whose name
          # is package.json's version, so they go stale the same way.
          versions() {
            printf 'flake.nix\t%s\n' \
              "$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' flake.nix \
                 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
            printf 'bolt/version.bend\t%s\n' \
              "$(grep -A1 'def text()' bolt/version.bend \
                 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
            for j in editors/vscode/package.json editors/vscode/package-lock.json; do
              printf '%s\t%s\n' "$j" "$(node -p "require('./$j').version")"
            done
            for r in README.md editors/vscode/README.md; do
              printf '%s\t%s\n' "$r" \
                "$(grep -oE 'bolt-[0-9]+\.[0-9]+\.[0-9]+\.vsix' "$r" \
                   | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
            done
            printf 'bolt/spec/cases.bend\t%s\n' \
              "$(grep -oE 'bolt [0-9]+\.[0-9]+\.[0-9]+' bolt/spec/cases.bend \
                 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
            printf 'bolt/spec/LAWS.bend\t%s\n' \
              "$(grep -oE '\\"version\\":\\"[0-9]+\.[0-9]+\.[0-9]+' bolt/spec/LAWS.bend \
                 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          }

          # the one version the files name, or the disagreement, by name
          agreed() {
            local seen
            seen=$(versions | cut -f2 | sort -u)
            if [ "$(printf '%s\n' "$seen" | wc -l)" -ne 1 ] || [ -z "$seen" ]; then
              echo "the version files disagree:" >&2
              versions >&2
              return 1
            fi
            printf '%s\n' "$seen"
          }

          file_ver=$(agreed)

          ver=$(printf '%s' "$VERSION_IN" | tr -d '[:space:]')
          ver="${ver#v}"
          bump_files=0
          if [ -n "$ver" ]; then
            :
          elif [ "${BUMP:-none}" != none ]; then
            IFS=. read -r maj min pat <<< "$file_ver"
            case "$BUMP" in
              major) ver="$((maj + 1)).0.0" ;;
              minor) ver="$maj.$((min + 1)).0" ;;
              patch) ver="$maj.$min.$((pat + 1))" ;;
              *) echo "unknown bump: $BUMP"; exit 1 ;;
            esac
            bump_files=1
          else
            ver="$file_ver"
          fi

          if ! echo "$ver" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "version must be X.Y.Z, got: $ver"
            exit 1
          fi
          if [ "$bump_files" -eq 0 ] && [ "$ver" != "$file_ver" ]; then
            echo "asked to tag v$ver but the files are $file_ver"
            echo "bump them first, or use bump="
            exit 1
          fi

          if [ "$bump_files" -eq 1 ]; then
            sed -i -E 's/version = "[0-9]+\.[0-9]+\.[0-9]+"/version = "'"$ver"'"/' flake.nix
            sed -i -E 's/"[0-9]+\.[0-9]+\.[0-9]+"/"'"$ver"'"/' bolt/version.bend
            # npm owns package.json and package-lock.json together; sed on one
            # of them is how they drifted apart before
            ( cd editors/vscode && npm version "$ver" \
                --no-git-tag-version --allow-same-version >/dev/null )
            sed -i -E 's/bolt-[0-9]+\.[0-9]+\.[0-9]+\.vsix/bolt-'"$ver"'.vsix/g' \
              README.md editors/vscode/README.md
            sed -i -E 's/bolt [0-9]+\.[0-9]+\.[0-9]+/bolt '"$ver"'/' bolt/spec/cases.bend
            sed -i -E 's/\\"version\\":\\"[0-9]+\.[0-9]+\.[0-9]+/\\"version\\":\\"'"$ver"'/' \
              bolt/spec/LAWS.bend
            written=$(agreed)
            if [ "$written" != "$ver" ]; then
              echo "wrote $ver but the files now say $written"
              exit 1
            fi
          fi

          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "bump_files=$bump_files" >> "$GITHUB_OUTPUT"
      - name: Commit version bump
        id: commit
        if: steps.ver.outputs.bump_files == '1'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Release v${{ steps.ver.outputs.version }}
          file_pattern: flake.nix bolt/version.bend editors/vscode/package.json editors/vscode/package-lock.json README.md editors/vscode/README.md bolt/spec/cases.bend bolt/spec/LAWS.bend
          branch: ${{ github.ref_name }}
          disable_globbing: true
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ steps.commit.outputs.commit_hash || github.sha }}
