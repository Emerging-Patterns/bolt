# Cuts a vX.Y.Z tag and GitHub Release from workflow_dispatch
# (a GITHUB_TOKEN tag does not start release.yml).
#
# How to cut a release
#   1. Land the version on the default branch. Every path in
#      .github/hub.env VERSION_FILES must be the same X.Y.Z.
#   2. Actions → Tag → Run workflow, from that branch:
#        - leave version empty and bump=none → tag what the files say
#        - version=X.Y.Z → tag that (fails if the files disagree)
#        - bump=patch|minor|major → rewrite the version files, commit,
#          tag the new X.Y.Z
#   3. Or tag locally: `git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z`
#      (release.yml then publishes and opens the GitHub Release).
#
# Publishes ENTRY in .github/hub.env to bendhub. The 0x hash goes in
# the GitHub Release name (`NAME X.Y.Z (0x…)`) and README; the git
# tag stays vX.Y.Z. Does not publish the VS Code extension.
# Does not build a native binary (that compile OOMs on typical GHA).

name: tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to tag (empty = version in the repo files)"
        required: false
        type: string
        default: ""
      bump:
        description: "If version is empty, bump files then tag"
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Resolve version
        id: ver
        env:
          VERSION_IN: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: .github/scripts/hub.sh version
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Publish to bendhub
        id: hub
        uses: ./.github/actions/publish-hub
      - name: Write hub identity into README
        run: .github/scripts/hub.sh readme "${{ steps.hub.outputs.hash }}" "${{ steps.hub.outputs.entry }}"
      - name: Release name
        id: title
        run: .github/scripts/hub.sh name "${{ steps.ver.outputs.version }}" "${{ steps.hub.outputs.hash }}"
      - name: Commit version and hub identity
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Release v${{ steps.ver.outputs.version }}
          file_pattern: ${{ steps.ver.outputs.version_files }} README.md
          branch: ${{ github.ref_name }}
          disable_globbing: true
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ steps.title.outputs.name }}
          generate_release_notes: true
          target_commitish: ${{ steps.commit.outputs.commit_hash || github.sha }}
