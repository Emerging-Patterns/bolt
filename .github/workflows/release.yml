# On a pushed v* tag (a human `git tag -a && git push`, or tag.yml):
# open a GitHub Release. Tag + GitHub Release only:
#   - do not publish the VS Code extension (AGENTS.md)
#   - do not `bend --publish`
#
# No native package attach: bolt's flake build OOMs on typical GHA RAM.
# GitHub already ships a source archive on the release.
#
# Notes: CHANGELOG.md section for this version if present, else GitHub's
# generated notes from commits since the previous tag.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "skip: $tag is not a vX.Y.Z tag"
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          ver="${tag#v}"
          extra=()
          case "$tag" in
            *-*) extra+=(--prerelease) ;;
          esac
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$ver" '
              $0 ~ "^##[ \\[]+v?" ver {found=1; print; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md > /tmp/release-notes.md
          fi
          if [ -s /tmp/release-notes.md ]; then
            gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md "${extra[@]}"
          else
            gh release create "$tag" --title "$tag" --generate-notes "${extra[@]}"
          fi
