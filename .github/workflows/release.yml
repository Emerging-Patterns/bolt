# On a pushed v* tag (`git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z`):
# open a GitHub Release. Tag + GitHub Release only:
#   - do not publish the VS Code extension (AGENTS.md)
#   - do not upload to the Bend hub
#
# The hub upload is `publish.yml`, and it is deliberately not here. Pushing a
# tag is cheap and reversible; a package on the hub is neither, so the two do
# not share a trigger. `publish.yml` is workflow_dispatch only, takes an
# existing tag, and runs `ez publish`: a person running it is the ask
# AGENTS.md means. A tag that turns out to be wrong costs a deleted release.
#
# Nothing is attached but the source archive GitHub already ships. The two
# documented ways in are `nix profile install` and one `bend` line
# (README.md), and neither reads a binary off a release.
# Notes are GitHub-generated from commits since the previous tag.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    uses: Emerging-Patterns/actions/.github/workflows/github-release.yml@9523e8b294ae014fade5861c32d5ab911866acb2
