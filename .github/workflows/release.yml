# On a pushed v* tag (`git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z`):
# open a GitHub Release. Tag + GitHub Release only:
#   - do not publish the VS Code extension (AGENTS.md)
#   - do not `bend --publish`
#
# Nothing is attached but the source archive GitHub already ships. The two
# documented ways in are `nix profile install` and one `bend` line
# (README.md), and neither reads a binary off a release.
# Notes are GitHub-generated from commits since the previous tag.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
