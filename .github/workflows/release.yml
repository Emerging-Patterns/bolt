# On a pushed v* tag (`git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z`):
# open a GitHub Release. Tag + GitHub Release only:
#   - do not publish the VS Code extension (AGENTS.md)
#   - do not `bend --publish`
#
# No native package attach: bolt's flake build OOMs on typical GHA RAM.
# GitHub already ships a source archive on the release.
# Notes are GitHub-generated from commits since the previous tag.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require vX.Y.Z
        id: tag
        run: |
          set -euo pipefail
          if echo "${GITHUB_REF_NAME}" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip: ${GITHUB_REF_NAME} is not a vX.Y.Z tag"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub Release
        if: steps.tag.outputs.ok == '1'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
