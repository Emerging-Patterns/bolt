name: Publish to bendhub
description: Publish ENTRY from .github/hub.env; emit the 0x hash

outputs:
  hash:
    description: Content hash, 0x plus hex
    value: ${{ steps.hub.outputs.hash }}
  entry:
    description: Path inside the package
    value: ${{ steps.hub.outputs.entry }}
  identity:
    description: 0xhash plus the published path
    value: ${{ steps.hub.outputs.identity }}

runs:
  using: composite
  steps:
    - name: Check hub glue
      shell: bash
      run: .github/scripts/hub.sh selftest
    - name: Publish hub entry
      id: hub
      shell: bash
      run: nix develop -c .github/scripts/hub.sh publish
