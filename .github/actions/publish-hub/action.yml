name: Publish bolt to bendhub
description: Publish bolt/main.bend with the flake's bend; emit the 0x hash

outputs:
  hash:
    description: Content hash, 0x plus hex
    value: ${{ steps.hub.outputs.hash }}
  entry:
    description: Path inside the package, usually bolt/main.bend
    value: ${{ steps.hub.outputs.entry }}
  identity:
    description: 0xhash/bolt/main.bend
    value: ${{ steps.hub.outputs.identity }}

runs:
  using: composite
  steps:
    - name: Check hub glue
      shell: bash
      run: .github/scripts/hub.sh selftest
    - name: Publish bolt/main.bend
      id: hub
      shell: bash
      run: nix develop -c .github/scripts/hub.sh publish
